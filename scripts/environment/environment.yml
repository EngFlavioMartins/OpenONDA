name: OpenONDA
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Python 3.11 also supports the legacy x86-64 macOS Taichi wheel.
  - python=3.11
  - pip>=24
  - setuptools>=68
  - wheel
  - numpy>=1.26
  - numpy-stl>=3.2
  - scipy>=1.11
  - matplotlib>=3.8
  - pydantic>=2.5
  - h5py>=3.10
  - numba>=0.59
  - pandas>=2.1
  - defusedxml>=0.7
  - gmsh>=4.11
  - pyamg>=5
  - pygit2>=1.13
  - pyvista>=0.43
  - vtk>=9.3
  # Taichi is installed by the OpenONDA wheel below because its Intel-macOS
  # compatibility pin is expressed with Python platform markers in pyproject.toml.
