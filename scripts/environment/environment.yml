name: ofw
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13
  - pip
  # Build toolchain (needed to compile the OFW Cython/C++ extension)
  - c-compiler
  - cxx-compiler
  - cython
  # Core numerics
  - numpy
  - scipy
  - matplotlib
  - pyyaml
  # Visualization — required for the tutorials' field-slice figures (Allplot)
  - pyvista
  - vtk
  - pip:
    # Python-side MPI for OFW parallel runs.  Installed via pip — NOT conda — so
    # it builds against the *system* MPI that `mpirun` and OpenFOAM use, avoiding
    # an ABI clash.  Requires a system mpicc on PATH (e.g. OpenMPI).
    - mpi4py
