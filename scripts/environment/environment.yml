name: OpenONDA
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Python 3.11 is the single supported runtime across FVM, VPM/Taichi,
  # PETSc/MPI, visualization, and the official OpenVSP Python package.
  - python=3.11
  - pip
  # Build toolchain (needed to compile the OFW Cython/C++ extension)
  - c-compiler
  - cxx-compiler
  - cython
  # Core numerics
  - numpy
  - scipy
  - matplotlib
  - pyyaml
  - pandas
  - h5py
  - numba
  - defusedxml
  # Native FVM mesh, pressure-solver, and distributed-linear-algebra stack.
  # Keep mpi4py, PETSc, and petsc4py in Conda so they resolve against one MPI.
  - gmsh
  - pyamg
  - pygit2
  - mpi4py
  - openmpi
  - petsc
  - petsc4py
  # Visualization dependencies (hard to build via pip)
  - pyvista
  - vtk
  # Runtime validation. Development-only tooling belongs in the project extras,
  # not the production FVM/VPM environment used to run a case.
  - pytest>=8
  - ruff>=0.9
  # Fast type checker for the agentic type-check loop (see AGENTS.md / pyproject
  # [tool.pyrefly]). Used by Claude Code and Codex/ChatGPT to catch signature and
  # Optional-handling regressions in FVM/coupler changes before they land.
  - pyrefly>=1.1
  - pip:
    # Keep Pydantic and its compiled core under one package manager.
    - pydantic==2.13.4
    - pydantic-core==2.46.4
    # Conda's Gmsh package supplies the native binary on macOS ARM but does not
    # install the Python API used by the mesh reader and its tests.
    - gmsh==4.15.2
    # GPU backend for the VPM solver (pip-only; pinned to the tested release).
    # On NVIDIA driver 580+ the CUDA backend is buggy with 1.7.x — run the VPM
    # tutorials with OPENONDA_PROCESSING_UNIT=GPU_VULKAN (see tutorial allrun.sh).
    - taichi==1.7.3
