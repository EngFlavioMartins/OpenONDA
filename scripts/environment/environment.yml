name: OpenONDA
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13
  - pip
  # Build toolchain (needed to compile the OFW Cython/C++ extension)
  - c-compiler
  - cxx-compiler
  - cython
  # Core numerics
  - numpy
  - scipy
  - matplotlib
  - pyyaml
  - pandas
  - h5py
  - numba
  - pydantic
  - defusedxml
  # Visualization dependencies (hard to build via pip)
  - pyvista
  - vtk
  - pip:
    # GPU backend for the VPM solver (pip-only; pinned to the tested release).
    # On NVIDIA driver 580+ the CUDA backend is buggy with 1.7.4 — run the VPM
    # tutorials with OPENONDA_PROCESSING_UNIT=GPU_VULKAN (see tutorial allrun.sh).
    - taichi==1.7.4
    # Data Version Control for simulation results (see docs/data_management.md).
    - dvc
    # Python-side MPI for the OFW/coupler parallel runs (cross-rank Barrier in
    # source/coupler/core/solver.py:497).  Installed via pip — NOT conda — so it
    # builds against the *system* MPI that `mpirun` and OpenFOAM use, avoiding an
    # ABI clash.  Requires a system mpicc on PATH (e.g. OpenMPI 5.x).
    - mpi4py
