name: OpenONDA-parallel
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Python 3.11 also supports the legacy x86-64 macOS Taichi wheel.
  - python=3.11
  - pip>=24
  - setuptools>=68
  - wheel
  - numpy>=1.26
  - scipy>=1.11
  - matplotlib>=3.8
  - pydantic>=2.5
  - h5py>=3.10
  - numba>=0.59
  - pandas>=2.1
  - defusedxml>=0.7
  - gmsh>=4.11
  - pyamg>=5
  - pygit2>=1.13
  - pyvista>=0.43
  - vtk>=9.3
  # Keep the complete distributed stack under one package manager so PETSc,
  # petsc4py, mpi4py, and the launcher share the same MPI implementation.
  - openmpi>=5
  - mpi4py>=4
  - petsc>=3.21
  - petsc4py>=3.21
