name: OpenONDA-parallel
channels:
  - conda-forge
  - nodefaults
dependencies:
  # CPython 3.11 supports the Taichi wheels on all supported platforms.
  - python=3.11
  - pip>=24
  - setuptools>=77
  - wheel
  - numpy>=1.26
  - scipy>=1.12
  - matplotlib>=3.8
  - h5py>=3.10
  - numba>=0.59
  - pandas>=2.1
  - defusedxml>=0.7
  - pyamg>=5
  - pyvista>=0.43
  - vtk>=9.3
  # Taichi is installed by the OpenONDA wheel below because its Intel-macOS
  # compatibility pin is expressed with Python platform markers in pyproject.toml.
  # Keep the complete distributed stack under one package manager so PETSc,
  # petsc4py, mpi4py, and the launcher share the same MPI implementation.
  - openmpi>=5
  - mpi4py>=4
  - petsc>=3.21
  - petsc4py>=3.21
