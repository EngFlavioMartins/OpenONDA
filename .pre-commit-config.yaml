default_language_version:
  python: python3

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
      - id: ruff-format
        args: [--check]

  - repo: local
    hooks:
      - id: vulture
        name: vulture (dead code, ≥90% confidence)
        entry: vulture
        language: python
        additional_dependencies: ["vulture>=2"]
        types: [python]
        pass_filenames: false
        args: [source/solvers/fvm, source/solvers/vpm, --min-confidence, "90"]

  - repo: local
    hooks:
      - id: bandit
        name: bandit (security)
        entry: bandit
        language: python
        additional_dependencies: ["bandit>=1.7"]
        types: [python]
        pass_filenames: false
        args:
          - -r
          - source/solvers/fvm
          - source/solvers/vpm
          - --skip
          - B101       # assert_used (fine in tests and physics kernels)
          - -ll        # report only medium/high severity

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
        # Files managed by Git LFS are exempt from this size check.
        args: [--maxkb=10240]
        exclude: "^tutorials/(.*/figures/|vpm/0[56]_(rotor_flow|quadcopter)/assets/(animation/)?.*\\.gif$)"
