default_language_version:
  python: python3

repos:
  # ── Formatting & linting (ruff replaces flake8/isort/pyupgrade) ──────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff                # lint: E/F/W/I/N/UP/B/C4/SIM (see pyproject.toml)
        args: [--fix]
      - id: ruff-format         # opinionated formatter (replaces black)

  # ── Dead-code detection ───────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: vulture
        name: vulture (dead code, ≥90% confidence)
        entry: vulture
        language: python
        additional_dependencies: ["vulture>=2"]
        types: [python]
        pass_filenames: false
        args: [source/solvers/VPM, --min-confidence, "90"]

  # ── Security audit ────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: bandit
        name: bandit (security)
        entry: bandit
        language: python
        additional_dependencies: ["bandit>=1.7"]
        types: [python]
        pass_filenames: false
        args:
          - -r
          - source/solvers/VPM
          - --skip
          - B101       # assert_used (fine in tests and physics kernels)
          - -ll        # report only medium/high severity

  # ── Standard pre-commit utilities ─────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements       # catches stray breakpoint() / pdb.set_trace()
      - id: check-added-large-files
        args: [--maxkb=500]
