default_language_version:
  python: python3

# ─────────────────────────────────────────────────────────────────────────────
# REPORT-ONLY pre-commit.
#
# No hook here rewrites files during a commit. That removes the "unstaged files
# stashed → hook reformats → rolling back fixes" deadlock that happens when a
# file is partially staged: with nothing to auto-fix, pre-commit never stashes,
# so it can never roll back. Hooks *flag* problems and block the commit; you fix
# them yourself with one command and re-commit:
#
#     ruff check --fix source tests      # apply lint fixes
#     ruff format source tests           # apply formatting
#
# (or `pre-commit run --all-files` to see everything at once.)
# ─────────────────────────────────────────────────────────────────────────────

repos:
  # ── Lint & format (report only — never modifies files) ───────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff                # lint: E/F/W/I/N/UP/B/C4/SIM (see pyproject.toml)
        # No --fix: report violations, do not rewrite. Run `ruff check --fix` yourself.
      - id: ruff-format         # verify formatting only; --check never rewrites.
        args: [--check]

  # ── Local repository checks (report only) ────────────────────────────────────
  - repo: local
    hooks:
      - id: canonical-nomenclature
        name: canonical physical nomenclature (report only)
        entry: python scripts/check_nomenclature.py --paths
        language: system
        pass_filenames: false

      - id: vulture
        name: vulture (dead code, ≥90% confidence)
        entry: vulture
        language: python
        additional_dependencies: ["vulture>=2"]
        types: [python]
        pass_filenames: false
        args: [source/solvers/fvm, source/solvers/vpm, --min-confidence, "90"]

  # ── Security audit (report only) ─────────────────────────────────────────────
  - repo: local
    hooks:
      - id: bandit
        name: bandit (security)
        entry: bandit
        language: python
        additional_dependencies: ["bandit>=1.7"]
        types: [python]
        pass_filenames: false
        args:
          - -r
          - source/solvers/fvm
          - source/solvers/vpm
          - --skip
          - B101       # assert_used (fine in tests and physics kernels)
          - -ll        # report only medium/high severity

  # ── Structural checks (all read-only — none of these modify files) ───────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements       # catches stray breakpoint() / pdb.set_trace()
      - id: check-added-large-files
        # Processed profiles can be a few MiB; raw states remain excluded.
        args: [--maxkb=10240]
