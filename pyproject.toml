[build-system]
requires = [
    "setuptools>=68.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "OpenONDA"
dynamic = ["version"]
description = "Native finite-volume and vortex-particle CFD solvers with hybrid coupling"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["license"]
authors = [
    {name = "Flavio Martins", email = "f.m.martins@tudelft.nl"},
    {name = "Artur Palha"},
    {name = "Rention Pasolari"},
]
maintainers = [
    {name = "Flavio Martins", email = "f.m.martins@tudelft.nl"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]
keywords = [
    "CFD",
    "computational fluid dynamics",
    "finite volume method",
    "Python",
    "vortex particle method",
    "GPU computing",
    "hybrid coupling",
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "pydantic>=2.5.0",
    "h5py>=3.10.0",
    "numba>=0.59.0",
    "pandas>=2.1.0",
    "defusedxml>=0.7.1",
    "taichi>=1.7.4,<1.8; platform_system!='Darwin' or platform_machine!='x86_64'",
    "taichi==1.7.1; platform_system=='Darwin' and platform_machine=='x86_64'",
    "gmsh>=4.11.0; platform_system!='Darwin' or platform_machine!='x86_64'",
    "gmsh>=4.11.0,<4.13; platform_system=='Darwin' and platform_machine=='x86_64'",
    "pyamg>=5.0.0",
    "pygit2>=1.13.0",
    "pyvista>=0.43.0",
    "vtk>=9.3.0",
]

[project.optional-dependencies]
# Test and verification tools.
test = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.2.0",
    "pytest-benchmark>=4.0.0",
    "pytest-random-order>=1.1.0",
    "hypothesis>=6.0.0",
]

# Collective FVM sparse solves. The Conda environment is the recommended way
# to obtain mpi4py, PETSc, and petsc4py against one MPI implementation.
parallel = [
    "mpi4py>=4.0.0",
    "petsc4py>=3.21.0",
]

# Development dependencies.
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.2.0",
    "pytest-random-order>=1.1.0",
    "hypothesis>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.0.0",
    "pyrefly>=1.1.0",
    "complexipy>=0.1.0",
    "vulture>=2.0.0",
    "tach>=0.1.0",
    "interrogate>=1.5.0",
    "bandit[toml]>=1.7.0",
    "pip-audit>=2.0.0",
    "scalene>=1.5.0",
    "pre-commit>=2.10.0",
    "pytest-benchmark>=4.0.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

# Documentation building
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
    "sphinx-autodoc-typehints>=2.0.0",
]

[tool.vulture]
# Minimum confidence for reporting unused code (0-100).
min_confidence = 80
# b_vec: mutated in-place with numpy +=; vulture cannot track writes as reads.
ignore_names = ["b_vec"]

[project.urls]
Homepage = "https://github.com/EngFlavioMartins/OpenONDA"
Repository = "https://github.com/EngFlavioMartins/OpenONDA"
Documentation = "https://github.com/EngFlavioMartins/OpenONDA/tree/main/docs"
"Bug Reports" = "https://github.com/EngFlavioMartins/OpenONDA/issues"
Changelog = "https://github.com/EngFlavioMartins/OpenONDA/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "source.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["openonda*", "source*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
"source" = ["py.typed"]

# Development tools configuration
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "docs/",
    "build/",
    "dist/",
    ".eggs/",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line too long — handled by formatter
    "N803",   # argument name should be lowercase — scientific notation (A, N, U, …)
    "N806",   # variable in function should be lowercase — scientific notation
    "N802",   # function name should be lowercase — physics conventions
    "N815",   # mixed-case variable in class — scientific conventions
    "N999",   # module name invalid — tutorial/script names
    "E402",   # module-level import not at top — intentional conditional imports
    "B008",   # function call in default argument — Taichi/pydantic patterns
]

[tool.ruff.lint.per-file-ignores]
"tutorials/*" = ["ALL"]
"scripts/*" = ["T201"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
implicit_optional = true
warn_unused_ignores = false
warn_return_any = false
warn_unused_configs = false
show_error_codes = true

# Taichi DSL uses invalid Python type syntax (ti.template(), etc.)
# Suppress globally because it appears across many VPM files.
disable_error_code = ["valid-type"]

# VPM and FVM have legacy type debt that is being fixed incrementally.
# When running mypy on coupler/, ignore errors in imported solver code
# so that only genuine coupler/ issues are reported.
[[tool.mypy.overrides]]
module = "source.solvers.FVM.*"
ignore_errors = true

[tool.ty]

[tool.ty.environment]
python-version = "3.11"
root = ["source/"]

[tool.ty.rules]
unresolved-import = "ignore"
# Taichi DSL uses invalid Python type syntax (ti.template(), ti.types.vector() etc.)
# Equivalent to mypy's disable_error_code = ["valid-type"] for the VPM module.
invalid-type-form = "ignore"
# Dynamic attributes: Taichi field members and sys._vpm_* stdout redirect helpers
unresolved-attribute = "ignore"
# Legacy: many parameters use `= None` as default on typed params; fixing incrementally
invalid-parameter-default = "ignore"
# Legacy: class fields typed as ndarray/module but assigned None at class level
invalid-assignment = "ignore"
# Taichi types are subscriptable at runtime but not visible to static analysis
not-subscriptable = "ignore"
# Taichi-aware function calls and duck-typed VPM API; fixing incrementally
invalid-argument-type = "ignore"
call-top-callable = "ignore"
unknown-argument = "ignore"
unsupported-operator = "ignore"
invalid-return-type = "ignore"
missing-argument = "ignore"

# ── Pyrefly (fast type checker, used in the agentic type-check loop) ──────────
# `pyrefly check` at the repo root type-checks the actively-maintained Python:
# the FVM solver, the coupler, and shared utilities. The VPM subtree is
# intentionally excluded because its Taichi DSL is not statically typeable — the
# same reason [tool.ty] / [tool.mypy] suppress it. See AGENTS.md for how agents
# (Claude Code, Codex/ChatGPT) are expected to use this.
[tool.pyrefly]
project-includes = [
    "source/solvers/FVM",
    "source/coupler",
    "source/utilities",
]
project-excludes = [
    "**/__pycache__",
    "**/*.pyx",
]
search-path = ["."]
python-version = "3.11"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "unit: isolated operator, parser, configuration, or failure-contract tests",
    "verification: analytical or mesh/time-refinement verification tests",
    "integration: tests that advance a complete solver or coupled algorithm",
    "parallel: tests for MPI/PETSc execution contracts",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests as requiring GPU (deselect with '-m \"not gpu\"')",
    "openfoam: marks tests as requiring OpenFOAM (deselect with '-m \"not openfoam\"')",
    "openvsp: marks tests as requiring OpenVSP (deselect with '-m \"not openvsp\"')",
    "benchmark: marks tests as performance benchmarks",
    "regression: marks tests as regression / snapshot tests",
    "fast: CPU-only tests for fast CI (deselect with '-m \"not fast\"')",
    "mpi: collective tests that must be launched under MPI with petsc4py",
]

[tool.coverage.run]
source = ["source"]
omit = [
    "*/tests/*",
    "*/examples/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.complexipy]
max_complexity = 15
exclude = ["tests/*", "tutorials/*", "scripts/*"]

[tool.skylos]
include = ["source/"]
exclude = ["tests/", "tutorials/", "scripts/", "**/__pycache__/"]
min_confidence = 80

[tool.bandit]
exclude_dirs = ["tests", "tutorials"]
skips = ["B101"]  # Skip assert_used warnings (needed for unit tests)

[tool.pytest-benchmark]
# Configuration for pytest-benchmark plugin
only_run_benchmarks = false
disable_gc = true
min_time = 0.000005
max_time = 1.0
min_rounds = 5
timer = "time.perf_counter"
calibration_precision = 10
warmup = true
