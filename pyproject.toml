[build-system]
requires = [
    "setuptools>=77.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "OpenONDA"
dynamic = ["version"]
description = "Native finite-volume and vortex-particle CFD solvers with hybrid coupling"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Flavio Martins", email = "f.m.martins@tudelft.nl"},
]
maintainers = [
    {name = "Flavio Martins", email = "f.m.martins@tudelft.nl"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]
keywords = [
    "CFD",
    "computational fluid dynamics",
    "finite volume method",
    "Python",
    "vortex particle method",
    "GPU computing",
    "hybrid coupling",
]
requires-python = "==3.11.*"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "h5py>=3.10.0",
    "numba>=0.59.0; platform_system!='Darwin' or platform_machine!='x86_64'",
    "numba>=0.59.0,<0.63; platform_system=='Darwin' and platform_machine=='x86_64'",
    "threadpoolctl>=3.1.0",
    "psutil>=5.9.0",
    "pandas>=2.1.0",
    "defusedxml>=0.7.1",
    "taichi>=1.7.4,<1.8; platform_system!='Darwin' or platform_machine!='x86_64'",
    "taichi==1.7.1; platform_system=='Darwin' and platform_machine=='x86_64'",
    "pyamg>=5.0.0",
    "pyvista>=0.43.0",
    "vtk>=9.3.0",
]

[project.scripts]
openonda = "openonda.cli:main"
openonda-verify-install = "openonda.verify_install:main"

[project.optional-dependencies]
# Optional CUDA-12 Gaussian image fields include matched toolkit headers.
# CPU/FMM installations do not require CuPy; the CUDA driver stays external.
gaussian-mesh-cuda12 = [
    "cupy-cuda12x[ctk]>=14.2,<15; platform_system=='Linux'",
]

# External Gmsh input/generation and accelerated STL reading. Native meshers
# and the built-in STL reader work without these packages.
meshing = [
    "gmsh>=4.11.0; platform_system!='Darwin' or platform_machine!='x86_64'",
    "gmsh>=4.11.0,<4.13; platform_system=='Darwin' and platform_machine=='x86_64'",
    "numpy-stl>=3.2",
]

# Collective FVM sparse solves. The Conda environment is the recommended way
# to obtain mpi4py, PETSc, and petsc4py against one MPI implementation.
parallel = [
    "mpi4py>=4.0.0",
    "petsc4py>=3.21.0",
]

# Lint and packaging tools for contributors.
dev = [
    "ruff>=0.9.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/EngFlavioMartins/OpenONDA"
Repository = "https://github.com/EngFlavioMartins/OpenONDA"
Documentation = "https://github.com/EngFlavioMartins/OpenONDA/tree/main/docs"
"Bug Reports" = "https://github.com/EngFlavioMartins/OpenONDA/issues"
Changelog = "https://github.com/EngFlavioMartins/OpenONDA/releases"

[tool.setuptools.dynamic]
version = {attr = "openonda.core.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["openonda*"]
exclude = ["*.__pycache__*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"openonda" = ["py.typed", "_resources/*.ttf", "*/**/*.md", "*/**/*.json"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*"]

# Lint and format settings
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
exclude = [
    ".git",
    "__pycache__",
    "docs/",
    "build/",
    "dist/",
    ".eggs/",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line too long: the formatter wraps lines
    "N803",   # argument name should be lowercase: scientific notation (A, N, U)
    "N806",   # variable in function should be lowercase: scientific notation
    "N802",   # function name should be lowercase: physics conventions
    "N815",   # mixed-case variable in class: scientific conventions
    "N999",   # module name invalid: tutorial and script names
    "E402",   # module-level import not at top: conditional imports
    "B008",   # function call in default argument: Taichi patterns
]

[tool.ruff.lint.per-file-ignores]
"tutorials/*" = ["ALL"]
"scripts/*" = ["T201"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
