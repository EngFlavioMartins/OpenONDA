[build-system]
requires = [
    "setuptools>=68.0",
    "wheel",
    "numpy>=1.24.0",
    "cython>=0.29.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "ofw"
dynamic = ["version"]
description = "A Python interface for in-line control of OpenFOAM solvers"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Flavio A. C. Martins", email = "f.m.martins@tudelft.nl"},
    {name = "Artur Palha"},
    {name = "Rention Pasolari"},
]
maintainers = [
    {name = "Flavio A. C. Martins", email = "f.m.martins@tudelft.nl"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
]
keywords = [
    "CFD",
    "computational fluid dynamics",
    "finite volume method",
    "OpenFOAM",
    "Python",
    "Cython",
    "external coupling",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyyaml>=5.0.0",
]

[project.optional-dependencies]
# Build the OFW Cython/C++ extension (requires a local OpenFOAM installation).
build = [
    "cython>=0.29.0",
]
# Tutorial post-processing / visualization.
viz = [
    "matplotlib>=3.6.0",
    "pyvista>=0.32.0",
    "vtk>=9.0.0",
]
# Python-side MPI for parallel tutorial runs (built against the system MPI).
mpi = [
    "mpi4py>=3.1.0",
]
# Development tooling.
dev = [
    "cython>=0.29.0",
    "pytest>=6.0.0",
    "ruff>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/EngFlavioMartins/OpenONDA"
Repository = "https://github.com/EngFlavioMartins/OpenONDA"
"Bug Reports" = "https://github.com/EngFlavioMartins/OpenONDA/issues"

[tool.setuptools.dynamic]
version = {attr = "ofw.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ofw*"]
exclude = ["tutorials*", "docs*", "scripts*"]

[tool.setuptools.package-data]
"ofw" = ["py.typed", "*.pyi"]

# Development tools configuration
[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "docs/",
    "build/",
    "dist/",
    "ofw/build/",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line too long — handled by formatter
    "N803",   # argument name should be lowercase — scientific notation (A, N, U, …)
    "N806",   # variable in function should be lowercase — scientific notation
    "N802",   # function name should be lowercase — physics conventions
    "N815",   # mixed-case variable in class — scientific conventions
    "N999",   # module name invalid — tutorial/script names
    "E402",   # module-level import not at top — intentional conditional imports
    "B008",   # function call in default argument
]

[tool.ruff.lint.per-file-ignores]
"tutorials/*" = ["ALL"]
"scripts/*" = ["T201"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tutorials"]
markers = [
    "openfoam: marks tests as requiring OpenFOAM (deselect with '-m \"not openfoam\"')",
]
