name: Nightly (full environment)

# Heavy evidence that is impractical on every pull request: the full
# conda/PETSc/MPI environment, collective MPI runs, the whole FVM suite, and the
# canonical install entry point. It runs daily and on demand, and failures remain
# visible even when branch protection does not require the scheduled workflow.

on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC daily
  workflow_dispatch:

defaults:
  run:
    shell: bash -el {0}

permissions:
  contents: read

jobs:
  fvm-full:
    name: Full FVM suite (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: OpenONDA
          environment-file: scripts/environment/environment.yml
          miniforge-version: latest
          use-mamba: true
      - run: python -m pip install -e ".[test]"
      - name: Whole FVM suite incl. slow + integration/validation
        run: >-
          python -m pytest tests/fvm
          -m "not mpi"
          --junitxml=fvm-full.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fvm-full
          path: fvm-full.xml

  petsc-mpi:
    name: PETSc/MPI collective (informational)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ranks: [2, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: OpenONDA-parallel
          environment-file: scripts/environment/environment-parallel.yml
          miniforge-version: latest
          use-mamba: true
      - run: python -m pip install -e ".[test]"
      - name: mpiexec -n ${{ matrix.ranks }}
        run: >-
          mpiexec --oversubscribe -n ${{ matrix.ranks }}
          python scripts/run_fvm_mpi_tests.py
      - name: Coupled two-rank public-API smoke
        if: matrix.ranks == 2
        run: >-
          mpiexec --oversubscribe -n 2
          python -m pytest -q tests/coupler/test_fvm_vpm_mpi_smoke.py -m mpi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fvm-petsc-mpi-${{ matrix.ranks }}
          path: artifacts/

  canonical-install:
    name: Canonical install entry point
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: base
          miniforge-version: latest
      - name: Install through scripts/install/install_conda.sh
        env:
          OPENONDA_CONDA_ENV: OpenONDA-clean
        run: scripts/install/install_conda.sh -y
      - name: Install test dependencies without an editable checkout
        run: conda run -n OpenONDA-clean python -m pip install ".[test]"
      - name: Non-hardware FVM + coupler evidence on the clean install
        run: >-
          conda run -n OpenONDA-clean python -m pytest tests/fvm tests/coupler
          -m "not mpi"
          --junitxml=clean-install.xml
      - name: Native FVM-VPM tutorials from isolated directories
        run: conda run -n OpenONDA-clean python scripts/validate_native_tutorials.py
      - name: Archive exact environment
        if: always()
        run: conda list -n OpenONDA-clean --explicit > clean-install-conda-explicit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-clean-install
          path: |
            clean-install.xml
            clean-install-conda-explicit.txt

  conda-macos:
    name: Conda install (Apple Silicon macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: OpenONDA
          environment-file: scripts/environment/environment.yml
          miniforge-version: latest
          use-mamba: true
      - run: python -m pip install .
      - name: Initialize dependencies and solve outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m openonda.verify_install --require-site-packages
          python -m pip check
