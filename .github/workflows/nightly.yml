name: Nightly (environment validation)

on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC daily
  workflow_dispatch:

defaults:
  run:
    shell: bash -el {0}

permissions:
  contents: read

jobs:
  canonical-install:
    name: Canonical install entry point
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: base
          miniforge-version: latest
      - name: Install and activate the editable environment
        run: |
          source install.sh
          test "$CONDA_DEFAULT_ENV" = OpenONDA
          cd "$RUNNER_TEMP"
          python -I -c "from openonda import fvm, vpm"
      - name: Run the maintained solver contracts on the clean install
        run: >-
          conda run -n OpenONDA python -m pytest tests
          --junitxml=clean-install.xml
      - name: Native FVM-VPM tutorials from isolated directories
        run: conda run -n OpenONDA python scripts/validate_native_tutorials.py
      - name: Archive exact environment
        if: always()
        run: conda list -n OpenONDA --explicit > clean-install-conda-explicit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-clean-install
          path: |
            clean-install.xml
            clean-install-conda-explicit.txt

  conda-macos:
    name: Conda install (Apple Silicon macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: base
          miniforge-version: latest
          use-mamba: true
      - name: Install and activate the editable environment
        run: |
          source install.sh
          test "$CONDA_DEFAULT_ENV" = OpenONDA
          cd "$RUNNER_TEMP"
          python -I -c "from openonda import fvm, vpm"
