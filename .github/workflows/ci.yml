name: CI

on:
  pull_request:
  push:
    branches: [development, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, types, and package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: ruff check source tests openonda
      - run: ruff format --check source tests openonda
      - name: Pyrefly report (existing baseline; do not grow it)
        continue-on-error: true
        run: pyrefly check
      - run: python -m build
      - run: twine check dist/*

  installed-wheel:
    name: Wheel import (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-14, python: "3.11"}
          - {os: macos-14, python: "3.13"}
          - {os: macos-15-intel, python: "3.11"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Install wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/openonda-wheel"
          "$RUNNER_TEMP/openonda-wheel/bin/python" -m pip install dist/*.whl
      - name: Import outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/openonda-wheel/bin/python" - <<'PY'
          import pathlib
          import openonda
          import openonda.coupler
          import openonda.fvm
          import openonda.vpm

          package = pathlib.Path(openonda.__file__).resolve()
          assert "site-packages" in str(package), package
          print(openonda.__version__, package)
          PY
          "$RUNNER_TEMP/openonda-wheel/bin/python" -m pip check

  fvm-fast:
    name: FVM correctness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: >-
          pytest tests/fvm
          -m "(unit or verification) and not slow and not mpi"
          -p no:cacheprovider
          --junitxml=fvm-fast.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fvm-fast
          path: fvm-fast.xml

  coupler:
    name: FVM↔VPM coupler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: >-
          pytest tests/coupler
          -m "not mpi"
          -p no:cacheprovider
          --junitxml=coupler.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coupler
          path: coupler.xml

  vpm-smoke:
    name: VPM kernel smoke (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: >-
          pytest tests/vpm/test_kernels_math.py tests/vpm/test_biot_savart.py
          -m "not gpu and not slow"
          -p no:cacheprovider
