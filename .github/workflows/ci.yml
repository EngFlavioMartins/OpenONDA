name: CI

on:
  pull_request:
  push:
    branches: [development, main]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, types, and package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Gmsh system libraries (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglu1-mesa
      - run: python -m pip install ".[dev]"
      - run: ruff check openonda tests tutorials scripts
      - run: ruff format --check openonda tests tutorials scripts
      - run: python -m build
      - run: twine check dist/*

  fast-solvers:
    name: Fast solver tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Gmsh system libraries (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglu1-mesa
      - name: Install thesis plotting dependencies
        run: |
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-extra dvipng
          kpsewhich newpxtext.sty
          kpsewhich newpxmath.sty
      - run: python -m pip install -e ".[test]"
      - run: >-
          python tests/run_isolated.py --junit-dir fast-solvers-results
          -m "not qualification and not slow and not gpu"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-solvers-results
          path: fast-solvers-results/

  cpu-qualification:
    name: CPU qualification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Gmsh system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglu1-mesa
      - run: python -m pip install -e ".[test]"
      - name: Run analytical and convergence qualifications
        run: >-
          python tests/run_isolated.py --junit-dir qualification-results
          -m "qualification and not gpu"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-qualification-${{ matrix.os }}
          path: qualification-results/

  slow-solver-checks:
    name: Slow CPU integration and restart checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: >-
          python tests/run_isolated.py --junit-dir slow-solver-checks-results
          -m "slow and not qualification and not gpu"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slow-solver-checks-results
          path: slow-solver-checks-results/

  nightly-gpu:
    name: Nightly GPU/backend qualification
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - name: Run GPU and stochastic backend qualifications
        run: >-
          python tests/run_isolated.py --junit-dir gpu-qualification-results
          -m "gpu or (qualification and stochastic)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-gpu-qualification
          path: gpu-qualification-results/

  installed-wheel:
    name: Wheel import (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.numerics || 'current' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.11", numerics: "numpy==1.26.4 scipy==1.12.0"}
          - {os: macos-14, python: "3.11"}
          # Taichi 1.7.1 is the last Intel-macOS wheel and supports Python 3.11.
          - {os: macos-15-intel, python: "3.11"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Gmsh system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglu1-mesa
      - run: python -m pip install build
      - run: python -m build
      - name: Install wheel in an isolated environment
        env:
          NUMERICS: ${{ matrix.numerics }}
        run: |
          python -m venv "$RUNNER_TEMP/openonda-wheel"
          "$RUNNER_TEMP/openonda-wheel/bin/python" -m pip install dist/*.whl $NUMERICS
      - name: Initialize dependencies and solve outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          env -u PYTHONPATH "$RUNNER_TEMP/openonda-wheel/bin/python" -I -m openonda.verify_install --require-site-packages
          "$RUNNER_TEMP/openonda-wheel/bin/python" -m pip check
          "$RUNNER_TEMP/openonda-wheel/bin/openonda" info
      - name: Verify editable installation outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/openonda-editable"
          "$RUNNER_TEMP/openonda-editable/bin/python" -m pip install -e .
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/openonda-editable/bin/python" -I -m openonda.verify_install
