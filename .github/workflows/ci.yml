name: CI

# Fast, blocking gate for every pull request and every push to the mainline
# branches. Pure-pip installs with pip caching keep this in the low-minutes
# range so it is worth reading. The heavy conda / PETSc-MPI / install-script
# evidence lives in nightly.yml, off the pull-request critical path.

on:
  pull_request:
  push:
    branches: [development, main]
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on the same ref so pushes don't pile up.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff==0.9.10
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  fvm-fast:
    name: FVM correctness (unit + verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[fvm-test]"
      - name: Fast physics-correctness suite
        run: >-
          pytest tests/fvm
          -m "(unit or verification) and not slow and not mpi and not openfoam"
          -p no:cacheprovider
          --junitxml=fvm-fast.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fvm-fast
          path: fvm-fast.xml

  coupler:
    name: FVM↔VPM coupler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[fvm-test]"
      - name: Coupler suite
        run: >-
          pytest tests/coupler
          -m "not mpi and not openfoam"
          -p no:cacheprovider
          --junitxml=coupler.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coupler
          path: coupler.xml

  vpm-smoke:
    name: VPM import + kernel smoke (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e "." taichi==1.7.3
      - name: Taichi CPU init + kernel math
        run: |
          python -c "import taichi as ti; ti.init(arch=ti.cpu)"
          pytest tests/vpm/test_kernels_math.py tests/vpm/test_biot_savart.py \
            -m "not gpu and not slow" \
            -p no:cacheprovider
