name: CI

on:
  pull_request:
  push:
    branches: [development, main]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, types, and package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Gmsh system libraries (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglu1-mesa
      - run: python -m pip install ".[dev]"
      - run: ruff check source tests tutorials scripts openonda
      - run: ruff format --check source tests tutorials scripts openonda
      - name: Enforce canonical nomenclature, paths, and stored artifact fields
        run: python scripts/check_nomenclature.py --paths --generated
      - name: Enforce documented and typed public API completeness
        run: python scripts/check_api_completeness.py
      - name: Enforce Python type safety
        run: pyrefly check
      - run: python -m build
      - run: twine check dist/*

  fast-solvers:
    name: Fast solver tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Gmsh system libraries (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglu1-mesa
      - run: python -m pip install -e ".[test]"
      - run: >-
          python -m pytest tests -p no:cacheprovider
          -m "not qualification and not slow and not gpu"
          --junitxml=fast-solvers-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-solvers-results
          path: fast-solvers-results.xml

  cpu-qualification:
    name: CPU qualification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Gmsh system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglu1-mesa
      - run: python -m pip install -e ".[test]"
      - name: Run analytical and convergence qualifications
        run: >-
          python -m pytest tests -p no:cacheprovider
          -m "qualification and not gpu"
          --junitxml=qualification-results.xml
          --numerical-report=numerical-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-qualification-${{ matrix.os }}
          path: |
            qualification-results.xml
            numerical-results.json

  nightly-gpu:
    name: Nightly GPU/backend qualification
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - name: Run GPU and stochastic backend qualifications
        run: >-
          python -m pytest tests -p no:cacheprovider
          -m "gpu or (qualification and stochastic)"
          --junitxml=gpu-qualification-results.xml
          --numerical-report=gpu-numerical-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-gpu-qualification
          path: |
            gpu-qualification-results.xml
            gpu-numerical-results.json

  installed-wheel:
    name: Wheel import (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-14, python: "3.11"}
          - {os: macos-14, python: "3.13"}
          # Taichi 1.7.1 is the last Intel-macOS wheel and supports Python 3.11.
          - {os: macos-15-intel, python: "3.11"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Gmsh system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglu1-mesa
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Install wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/openonda-wheel"
          "$RUNNER_TEMP/openonda-wheel/bin/python" -m pip install dist/*.whl
      - name: Initialize dependencies and solve outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/openonda-wheel/bin/python" -m openonda.verify_install --require-site-packages
          "$RUNNER_TEMP/openonda-wheel/bin/python" -m pip check
